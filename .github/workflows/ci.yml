name: CI

on:
  pull_request:
    branches:
      - main
  push:

jobs:
  validate:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: entregaai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d entregaai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Report runtime
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Apply test database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/entregaai_test?schema=public
        run: npx prisma migrate deploy

      - name: Test WhatsApp queue with PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/entregaai_test?schema=public
        run: npm run test:whatsapp --workspace api

      - name: Build
        run: npm run build

