server {
    listen 80;
    root /usr/share/nginx/html;
    location = /api/encomendas/leitura-etiqueta {
        # A API limita o arquivo a 5 MiB. A requisição também inclui o envelope multipart.
        client_max_body_size 6m;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
